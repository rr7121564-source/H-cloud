name: CI Build and Test

on:
  workflow_dispatch:
    inputs:
      task_type:
        required: true
      video_id:
        required: true
      sub_id:
        required: true
      rename:
        required: true
      chat_id:
        required: true
      dump_id:
        required: true
      thread_id:
        required: true

# ═══════════════════════════════════════════
# FIX: Ek waqt me ek hi run per repo
# ═══════════════════════════════════════════
concurrency:
  group: encoder-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run-tests:
    runs-on: ubuntu-latest
    # ═══════════════════════════════════════
    # FIX: 5 hour max timeout (pehle unlimited tha)
    # ═══════════════════════════════════════
    timeout-minutes: 300

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt update -qq > /dev/null 2>&1
          sudo apt install -y ffmpeg -qq > /dev/null 2>&1
          pip install pyrogram tgcrypto -q

      - name: Run CI Tests
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          TEST_PAYLOAD: ${{ secrets.GHOST_ENCODER }}
          TASK_TYPE: ${{ github.event.inputs.task_type }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}
          SUB_ID: ${{ github.event.inputs.sub_id }}
          RENAME: ${{ github.event.inputs.rename }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          DUMP_ID: ${{ github.event.inputs.dump_id }}
          THREAD_ID: ${{ github.event.inputs.thread_id }}
        run: |
          echo "$TEST_PAYLOAD" | base64 -d > test_suite.py
          python3 test_suite.py
          EXIT_CODE=$?
          rm -f test_suite.py
          exit $EXIT_CODE
