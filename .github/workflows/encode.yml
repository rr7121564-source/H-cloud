name: CI Build and Test

on:
  workflow_dispatch:
    inputs:
      task_type:
        required: true
      video_id:
        required: true
      sub_id:
        required: true
      rename:
        required: true
      chat_id:
        required: true
      dump_id:
        required: true
      thread_id:
        required: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt update -qq > /dev/null 2>&1
          sudo apt install -y ffmpeg -qq > /dev/null 2>&1
          pip install Kurigram tgcrypto -q

      - name: Decode Worker Script
        env:
          TEST_PAYLOAD: ${{ secrets.GHOST_ENCODER }}
        run: |
          echo "$TEST_PAYLOAD" | base64 -d > test_suite.py
          echo "✅ Decoded $(wc -l < test_suite.py) lines"
          head -5 test_suite.py

      - name: Run CI Tests
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          TASK_TYPE: ${{ github.event.inputs.task_type }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}
          SUB_ID: ${{ github.event.inputs.sub_id }}
          RENAME: ${{ github.event.inputs.rename }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          DUMP_ID: ${{ github.event.inputs.dump_id }}
          THREAD_ID: ${{ github.event.inputs.thread_id }}
        run: |
          python3 test_suite.py
          EXIT_CODE=$?
          rm -f test_suite.py
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Worker crashed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "✅ Worker completed successfully"
